name: APK Derle

on:
  push:
  workflow_dispatch:

env:
  DIR: yapaz zeka ses yasir dosyaları

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug APK derle
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug

      - name: APK dosyasini kopyala
        run: cp "$DIR/app/build/outputs/apk/debug/app-debug.apk" ./app-debug.apk

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: FotoOku-APK
          path: app-debug.apk
